[project]
name = "secscan"
version = "0.1.0"
description = "Escáner de seguridad unificado: secretos, código, librerías y configuración"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
secscan = "secscan.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
