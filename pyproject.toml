[project]
name = "secscan"
version = "0.1.0"
description = "Escáner de seguridad unificado: secretos, código, librerías y configuración"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = ["security", "devsecops", "sast", "sca", "secrets", "dast", "docker", "sarif"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "tzdata>=2024.1",
]

[project.scripts]
secscan = "secscan.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
